<svg width="100%" viewBox="0 0 900 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Arquitectura — aroca.dev</title>
<desc>Diagrama de arquitectura del portfolio aroca.dev construido con Astro y desplegado en Vercel</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Título -->
<text x="450" y="24" text-anchor="middle" style="font-size:15px;font-weight:500;fill:rgb(11,11,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Arquitectura — aroca.dev</text>

<!-- Contenedor Vercel -->
<rect x="10" y="36" width="880" height="370" rx="14" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="24" y="54" style="font-size:12px;font-weight:500;fill:#1D9E75;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Vercel</text>

<!-- BLOQUE: Navegador -->
<g>
  <rect x="30" y="65" width="160" height="80" rx="8" stroke-width="0.5" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);"/>
  <text x="110" y="97" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(60,52,137);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Navegador</text>
  <text x="110" y="115" text-anchor="middle" style="font-size:12px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Chrome · Firefox · Safari</text>
  <text x="110" y="133" text-anchor="middle" style="font-size:12px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">JS mínimo (i18n toggle)</text>
</g>

<!-- Flecha navegador → CDN -->
<line x1="190" y1="105" x2="268" y2="105" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text x="229" y="98" text-anchor="middle" style="font-size:10px;fill:rgb(100,100,100);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">HTTPS</text>

<!-- BLOQUE: Vercel CDN -->
<g>
  <rect x="270" y="65" width="160" height="80" rx="8" stroke-width="0.5" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);"/>
  <text x="350" y="97" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(8,80,65);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Vercel CDN</text>
  <text x="350" y="115" text-anchor="middle" style="font-size:12px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Edge Network Global</text>
  <text x="350" y="133" text-anchor="middle" style="font-size:12px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Cache · HTTPS · CI/CD</text>
</g>

<!-- Flecha CDN → Astro output -->
<line x1="430" y1="105" x2="508" y2="105" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text x="469" y="98" text-anchor="middle" style="font-size:10px;fill:rgb(100,100,100);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">sirve</text>

<!-- BLOQUE: Astro Build Output -->
<g>
  <rect x="510" y="65" width="160" height="80" rx="8" stroke-width="0.5" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);"/>
  <text x="590" y="97" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(99,56,6);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Astro Build</text>
  <text x="590" y="115" text-anchor="middle" style="font-size:12px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Static Site Generation</text>
  <text x="590" y="133" text-anchor="middle" style="font-size:12px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">0 KB JS por defecto</text>
</g>

<!-- Flecha Astro → GitHub -->
<line x1="670" y1="105" x2="748" y2="105" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text x="709" y="98" text-anchor="middle" style="font-size:10px;fill:rgb(100,100,100);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">deploy</text>

<!-- BLOQUE: GitHub -->
<g>
  <rect x="750" y="65" width="130" height="80" rx="8" stroke-width="0.5" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);"/>
  <text x="815" y="97" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(12,68,124);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">GitHub</text>
  <text x="815" y="115" text-anchor="middle" style="font-size:12px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">ArocaDev/aroca-dev</text>
  <text x="815" y="133" text-anchor="middle" style="font-size:12px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">push → auto deploy</text>
</g>

<!-- Separador -->
<line x1="30" y1="175" x2="870" y2="175" stroke="rgba(0,0,0,0.08)" stroke-width="0.8"/>
<text x="450" y="192" text-anchor="middle" style="font-size:11px;font-weight:500;fill:rgb(100,100,100);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">ESTRUCTURA DEL PROYECTO</text>

<!-- Bloque: src/pages -->
<g>
  <rect x="30" y="205" width="180" height="100" rx="8" stroke-width="0.5" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);"/>
  <text x="120" y="227" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(12,68,124);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">src/pages/</text>
  <text x="120" y="247" text-anchor="middle" style="font-size:11px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">index.astro</text>
  <text x="120" y="263" text-anchor="middle" style="font-size:11px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">proyectos/*.astro</text>
  <text x="120" y="279" text-anchor="middle" style="font-size:11px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">8 páginas de proyecto</text>
  <text x="120" y="295" text-anchor="middle" style="font-size:11px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">+ index one-page</text>
</g>

<!-- Bloque: src/styles -->
<g>
  <rect x="230" y="205" width="180" height="100" rx="8" stroke-width="0.5" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);"/>
  <text x="320" y="227" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(8,80,65);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">src/styles/</text>
  <text x="320" y="247" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">global.css</text>
  <text x="320" y="263" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">CSS puro · sin frameworks</text>
  <text x="320" y="279" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Variables CSS · Space Grotesk</text>
  <text x="320" y="295" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Inter · Tabler Icons</text>
</g>

<!-- Bloque: public -->
<g>
  <rect x="430" y="205" width="180" height="100" rx="8" stroke-width="0.5" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);"/>
  <text x="520" y="227" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(99,56,6);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">public/</text>
  <text x="520" y="247" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">favicon.png</text>
  <text x="520" y="263" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">capturas · GIFs</text>
  <text x="520" y="279" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">diagramas SVG</text>
  <text x="520" y="295" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">assets estáticos</text>
</g>

<!-- Bloque: i18n -->
<g>
  <rect x="630" y="205" width="250" height="100" rx="8" stroke-width="0.5" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);"/>
  <text x="755" y="227" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(60,52,137);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">i18n ES / EN</text>
  <text x="755" y="247" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">JS vanilla · data-es / data-en</text>
  <text x="755" y="263" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">localStorage · sin recarga</text>
  <text x="755" y="279" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">persistencia entre páginas</text>
  <text x="755" y="295" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">mismo toggle en todas</text>
</g>

<!-- Leyenda -->
<rect x="30" y="322" width="8" height="8" fill="rgb(83,74,183)" rx="1"/>
<text x="44" y="330" style="font-size:11px;fill:rgb(82,81,78);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Cliente / i18n</text>
<rect x="130" y="322" width="8" height="8" fill="rgb(15,110,86)" rx="1"/>
<text x="144" y="330" style="font-size:11px;fill:rgb(82,81,78);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Infraestructura</text>
<rect x="240" y="322" width="8" height="8" fill="rgb(133,79,11)" rx="1"/>
<text x="254" y="330" style="font-size:11px;fill:rgb(82,81,78);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Build / Assets</text>
<rect x="340" y="322" width="8" height="8" fill="rgb(24,95,165)" rx="1"/>
<text x="354" y="330" style="font-size:11px;fill:rgb(82,81,78);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Páginas Astro</text>

</svg>
