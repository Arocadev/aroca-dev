<svg viewBox="0 0 900 380" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:900px;margin:0 auto;display:block;">
<title>Arquitectura — Vulldecor Web</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="450" y="24" text-anchor="middle" style="font-size:15px;font-weight:500;fill:rgb(11,11,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Arquitectura — Vulldecor Web</text>

<!-- Contenedor Hostinger -->
<rect x="10" y="36" width="880" height="330" rx="14" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="24" y="54" style="font-size:12px;font-weight:500;fill:#1D9E75;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Hostinger</text>

<!-- Bloque: Navegador -->
<g>
  <rect x="30" y="65" width="160" height="90" rx="8" stroke-width="0.5" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);"/>
  <text x="110" y="92" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(60,52,137);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Navegador</text>
  <text x="110" y="110" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">HTML5 semántico</text>
  <text x="110" y="126" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">CSS3 · Flexbox · Grid</text>
  <text x="110" y="142" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">JavaScript vanilla</text>
</g>

<!-- Flecha nav → hosting -->
<line x1="190" y1="110" x2="268" y2="110" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text x="229" y="103" text-anchor="middle" style="font-size:10px;fill:rgb(100,100,100);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">HTTPS</text>

<!-- Bloque: Sitio estático -->
<g>
  <rect x="270" y="65" width="180" height="90" rx="8" stroke-width="0.5" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);"/>
  <text x="360" y="92" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(8,80,65);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Sitio estático</text>
  <text x="360" y="110" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">index.html · presupuesto.html</text>
  <text x="360" y="126" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">legal.html · sitemap.xml</text>
  <text x="360" y="142" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">robots.txt · sin build</text>
</g>

<!-- Flecha sitio → formulario -->
<line x1="450" y1="110" x2="528" y2="85" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="450" y1="110" x2="528" y2="145" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Bloque: FormSubmit -->
<g>
  <rect x="530" y="60" width="160" height="55" rx="8" stroke-width="0.5" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);"/>
  <text x="610" y="83" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(12,68,124);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">FormSubmit</text>
  <text x="610" y="101" text-anchor="middle" style="font-size:11px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Email al cliente · sin backend</text>
</g>

<!-- Bloque: WhatsApp -->
<g>
  <rect x="530" y="125" width="160" height="55" rx="8" stroke-width="0.5" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);"/>
  <text x="610" y="148" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(8,80,65);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">WhatsApp</text>
  <text x="610" y="166" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Mensaje preformateado</text>
</g>

<!-- Bloque: Google Maps -->
<g>
  <rect x="530" y="190" width="160" height="55" rx="8" stroke-width="0.5" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);"/>
  <text x="610" y="213" text-anchor="middle" style="font-size:14px;font-weight:500;fill:rgb(99,56,6);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Google Maps</text>
  <text x="610" y="231" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Embed · zona de trabajo</text>
</g>

<line x1="450" y1="110" x2="528" y2="217" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- SEO block -->
<rect x="30" y="195" width="420" height="75" rx="8" stroke-width="0.5" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);"/>
<text x="240" y="218" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(99,56,6);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">SEO Local</text>
<text x="240" y="238" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Schema.org LocalBusiness · Open Graph · meta tags</text>
<text x="240" y="256" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">sitemap.xml · robots.txt · RGPD · cookies localStorage</text>

<!-- Leyenda -->
<rect x="30" y="295" width="8" height="8" fill="rgb(83,74,183)" rx="1"/>
<text x="44" y="303" style="font-size:11px;fill:rgb(82,81,78);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Cliente</text>
<rect x="110" y="295" width="8" height="8" fill="rgb(15,110,86)" rx="1"/>
<text x="124" y="303" style="font-size:11px;fill:rgb(82,81,78);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Hosting / Integraciones</text>
<rect x="260" y="295" width="8" height="8" fill="rgb(24,95,165)" rx="1"/>
<text x="274" y="303" style="font-size:11px;fill:rgb(82,81,78);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Contacto</text>
<rect x="350" y="295" width="8" height="8" fill="rgb(133,79,11)" rx="1"/>
<text x="364" y="303" style="font-size:11px;fill:rgb(82,81,78);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">SEO / Analytics</text>
</svg>
