<svg viewBox="0 0 900 360" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:900px;margin:0 auto;display:block;">
<title>Flujo de contacto — Vulldecor Web</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="450" y="24" text-anchor="middle" style="font-size:15px;font-weight:500;fill:rgb(11,11,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Flujo de contacto — Vulldecor Web</text>

<!-- Paso 1: Usuario -->
<g>
  <rect x="30" y="60" width="140" height="70" rx="8" stroke-width="0.5" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);"/>
  <text x="100" y="87" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(60,52,137);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Usuario</text>
  <text x="100" y="105" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Llega a vulldecor.es</text>
  <text x="100" y="120" text-anchor="middle" style="font-size:11px;fill:rgb(83,74,183);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">ve servicios y precios</text>
</g>

<line x1="170" y1="95" x2="218" y2="95" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Paso 2: Formulario -->
<g>
  <rect x="220" y="60" width="150" height="70" rx="8" stroke-width="0.5" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);"/>
  <text x="295" y="87" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(8,80,65);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Formulario</text>
  <text x="295" y="105" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Selecciona servicio</text>
  <text x="295" y="120" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">e inmueble por botones</text>
</g>

<line x1="370" y1="95" x2="418" y2="95" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Paso 3: Decisión -->
<g>
  <rect x="420" y="60" width="150" height="70" rx="8" stroke-width="0.5" style="fill:rgb(250,238,218);stroke:rgb(133,79,11);"/>
  <text x="495" y="87" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(99,56,6);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">¿Cómo contactar?</text>
  <text x="495" y="105" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Validación cliente</text>
  <text x="495" y="120" text-anchor="middle" style="font-size:11px;fill:rgb(133,79,11);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">campos requeridos</text>
</g>

<!-- Flechas a las dos opciones -->
<line x1="495" y1="130" x2="340" y2="198" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text x="390" y="175" text-anchor="middle" style="font-size:10px;fill:rgb(100,100,100);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">WhatsApp</text>

<line x1="495" y1="130" x2="650" y2="198" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<text x="600" y="175" text-anchor="middle" style="font-size:10px;fill:rgb(100,100,100);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Email</text>

<!-- Opción A: WhatsApp -->
<g>
  <rect x="220" y="200" width="240" height="70" rx="8" stroke-width="0.5" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);"/>
  <text x="340" y="225" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(8,80,65);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">WhatsApp</text>
  <text x="340" y="243" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Abre app con mensaje preformateado</text>
  <text x="340" y="259" text-anchor="middle" style="font-size:11px;fill:rgb(15,110,86);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">datos del formulario incluidos</text>
</g>

<!-- Opción B: Email -->
<g>
  <rect x="530" y="200" width="240" height="70" rx="8" stroke-width="0.5" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);"/>
  <text x="650" y="225" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(12,68,124);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">FormSubmit</text>
  <text x="650" y="243" text-anchor="middle" style="font-size:11px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Email al propietario</text>
  <text x="650" y="259" text-anchor="middle" style="font-size:11px;fill:rgb(24,95,165);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">sin backend propio</text>
</g>

<!-- Resultado final -->
<line x1="340" y1="270" x2="450" y2="308" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="650" y1="270" x2="560" y2="308" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

<g>
  <rect x="370" y="310" width="260" height="35" rx="8" stroke-width="0.5" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);"/>
  <text x="500" y="332" text-anchor="middle" style="font-size:13px;font-weight:500;fill:rgb(60,52,137);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Cliente recibe solicitud de presupuesto</text>
</g>
</svg>
