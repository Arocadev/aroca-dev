<svg viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:900px;margin:0 auto;display:block;font-family:system-ui,sans-serif;background:#ffffff;">
<title>Flujo de pedido — Calidad Triple A</title>
<desc>Diagrama del flujo completo desde que el comprador añade al carrito hasta que el vendedor recibe el email con PDF y QR</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="22" text-anchor="middle" style="font-size:15px;font-weight:500;fill:#0b0b0b">Flujo de pedido — Calidad Triple A</text>

<!-- 1 Añadir al carrito -->
<rect x="240" y="36" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#085041">1. Añadir al carrito</text>
<text x="340" y="78" text-anchor="middle" style="font-size:12px;fill:#0F6E56">Seleccionar producto y talla</text>

<!-- 2 Checkout -->
<rect x="240" y="120" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="144" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#085041">2. Checkout</text>
<text x="340" y="162" text-anchor="middle" style="font-size:12px;fill:#0F6E56">Datos · País · Envío calculado</text>

<line x1="340" y1="92" x2="340" y2="120" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 3 Confirmar pedido -->
<rect x="240" y="204" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="228" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#085041">3. Confirmar pedido</text>
<text x="340" y="246" text-anchor="middle" style="font-size:12px;fill:#0F6E56">Popup de confirmación</text>

<line x1="340" y1="176" x2="340" y2="204" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 4a WhatsApp -->
<rect x="60" y="304" width="185" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="152" y="328" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#173404">4a. WhatsApp</text>
<text x="152" y="346" text-anchor="middle" style="font-size:12px;fill:#27500A">Mensaje preformateado</text>

<!-- 4b API pedido -->
<rect x="435" y="304" width="185" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="527" y="328" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#26215C">4b. API /pedido</text>
<text x="527" y="346" text-anchor="middle" style="font-size:12px;fill:#3C3489">Next.js server</text>

<line x1="280" y1="260" x2="200" y2="304" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="400" y1="260" x2="480" y2="304" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 5 PDF cliente -->
<rect x="60" y="400" width="185" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="152" y="424" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#173404">5. PDF descargable</text>
<text x="152" y="442" text-anchor="middle" style="font-size:12px;fill:#27500A">Para el comprador</text>

<line x1="152" y1="360" x2="152" y2="400" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 5b Generación documentos -->
<rect x="340" y="400" width="145" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="412" y="424" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#412402">PDF envío</text>
<text x="412" y="442" text-anchor="middle" style="font-size:12px;fill:#633806">Datos + etiqueta</text>

<rect x="495" y="400" width="125" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="557" y="424" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#412402">QR código</text>
<text x="557" y="442" text-anchor="middle" style="font-size:12px;fill:#633806">Datos de envío</text>

<line x1="480" y1="360" x2="430" y2="400" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="560" y1="360" x2="557" y2="400" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Email vendedor -->
<rect x="340" y="480" width="280" height="24" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="480" y="496" text-anchor="middle" style="font-size:12px;font-weight:500;fill:#4A1B0C">Resend → email vendedor con 3 adjuntos</text>

<line x1="412" y1="456" x2="430" y2="480" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="557" y1="456" x2="530" y2="480" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
