<svg viewBox="0 0 800 560" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:900px;margin:0 auto;display:block;font-family:system-ui,sans-serif;background:#ffffff;">
<title>Arquitectura del sistema — Calidad Triple A</title>
<desc>Diagrama de arquitectura del sistema Calidad Triple A</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="400" y="24" text-anchor="middle" style="font-size:16px;font-weight:600;fill:#0b0b0b">Arquitectura del sistema — Calidad Triple A</text>

<!-- ===== FILA 1: Comprador | Vercel container | Resend ===== -->

<!-- Comprador -->
<rect x="20" y="50" width="150" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="95" y="84" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#042C53">Comprador</text>
<text x="95" y="104" text-anchor="middle" style="font-size:12px;fill:#0C447C">Navega y compra</text>

<!-- Vercel container -->
<rect x="210" y="40" width="420" height="230" rx="14" fill="#F7FDF9" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="228" y="60" style="font-size:12px;font-weight:600;fill:#1D9E75">Vercel — producción</text>

<!-- Next.js (dentro de Vercel) -->
<rect x="228" y="68" width="170" height="80" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
<text x="313" y="96" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#085041">Next.js 15</text>
<text x="313" y="114" text-anchor="middle" style="font-size:12px;fill:#0F6E56">App Router · TypeScript</text>
<text x="313" y="130" text-anchor="middle" style="font-size:12px;fill:#0F6E56">Zustand · CSS puro</text>

<!-- API Route (dentro de Vercel) -->
<rect x="422" y="68" width="190" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="517" y="96" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#26215C">API /pedido</text>
<text x="517" y="114" text-anchor="middle" style="font-size:12px;fill:#3C3489">jsPDF · QRCode</text>
<text x="517" y="130" text-anchor="middle" style="font-size:12px;fill:#3C3489">Resend SDK</text>

<!-- Flecha Next.js → API -->
<line x1="398" y1="108" x2="422" y2="108" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Sanity CMS (dentro de Vercel) -->
<rect x="295" y="188" width="200" height="68" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="395" y="216" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#412402">Sanity CMS</text>
<text x="395" y="234" text-anchor="middle" style="font-size:12px;fill:#633806">Productos · Imágenes · Slugs</text>

<!-- Flechas hacia Sanity -->
<line x1="313" y1="148" x2="355" y2="188" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="517" y1="148" x2="455" y2="188" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Resend -->
<rect x="660" y="50" width="120" height="80" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="720" y="82" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#4A1B0C">Resend</text>
<text x="720" y="100" text-anchor="middle" style="font-size:12px;fill:#712B13">Email automático</text>
<text x="720" y="116" text-anchor="middle" style="font-size:12px;fill:#712B13">con adjuntos</text>

<!-- Flecha API → Resend -->
<line x1="612" y1="98" x2="660" y2="90" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== FILA 2: WhatsApp | | Vendedor ===== -->

<!-- WhatsApp -->
<rect x="20" y="180" width="150" height="68" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="95" y="208" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#173404">WhatsApp</text>
<text x="95" y="228" text-anchor="middle" style="font-size:12px;fill:#27500A">Confirmación pedido</text>

<!-- Flecha Comprador → Next.js -->
<line x1="170" y1="82" x2="228" y2="100" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="228" y1="116" x2="170" y2="110" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Flecha API → WhatsApp -->
<line x1="260" y1="270" x2="150" y2="214" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Vendedor -->
<rect x="660" y="180" width="120" height="68" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="720" y="208" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#2C2C2A">Vendedor</text>
<text x="720" y="228" text-anchor="middle" style="font-size:12px;fill:#444441">PDF · QR · email</text>

<!-- Flecha Resend → Vendedor -->
<line x1="720" y1="130" x2="720" y2="180" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== FILA 3: Namecheap | Sanity Studio | Cliente ===== -->

<!-- Namecheap -->
<rect x="20" y="340" width="150" height="80" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="95" y="370" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#2C2C2A">Namecheap</text>
<text x="95" y="390" text-anchor="middle" style="font-size:12px;fill:#444441">DNS · dominio</text>
<text x="95" y="406" text-anchor="middle" style="font-size:12px;fill:#444441">calidad3a.com</text>

<!-- Flecha Namecheap → Vercel -->
<line x1="170" y1="360" x2="210" y2="280" stroke="#888780" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Sanity Studio -->
<rect x="290" y="340" width="220" height="80" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="400" y="372" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#412402">Sanity Studio</text>
<text x="400" y="392" text-anchor="middle" style="font-size:12px;fill:#633806">calidad3a.com/studio</text>
<text x="400" y="408" text-anchor="middle" style="font-size:12px;fill:#633806">Gestión del catálogo</text>

<!-- Flecha Sanity CMS → Studio -->
<line x1="395" y1="256" x2="395" y2="340" stroke="#BA7517" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Cliente -->
<rect x="570" y="340" width="210" height="80" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="675" y="372" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#2C2C2A">Cliente (tienda)</text>
<text x="675" y="392" text-anchor="middle" style="font-size:12px;fill:#444441">Sube y edita productos</text>
<text x="675" y="408" text-anchor="middle" style="font-size:12px;fill:#444441">desde Sanity Studio</text>

<!-- Flecha Cliente → Studio -->
<line x1="570" y1="380" x2="510" y2="380" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ===== LEYENDA ===== -->
<rect x="20" y="460" width="760" height="80" rx="8" fill="#F9F9F7" stroke="#D3D1C7" stroke-width="0.8"/>
<text x="40" y="482" style="font-size:12px;font-weight:600;fill:#444441">Leyenda</text>
<line x1="40" y1="500" x2="80" y2="500" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="88" y="504" style="font-size:11px;fill:#444441">Interacción usuario</text>
<line x1="200" y1="500" x2="240" y2="500" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="248" y="504" style="font-size:11px;fill:#444441">Llamada de datos</text>
<line x1="360" y1="500" x2="400" y2="500" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="408" y="504" style="font-size:11px;fill:#444441">Configuración / DNS</text>
<line x1="530" y1="500" x2="570" y2="500" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="578" y="504" style="font-size:11px;fill:#444441">CMS → Studio</text>
<line x1="40" y1="526" x2="80" y2="526" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="88" y="530" style="font-size:11px;fill:#444441">Notificación WhatsApp</text>
<line x1="200" y1="526" x2="240" y2="526" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="248" y="530" style="font-size:11px;fill:#444441">Email automático (Resend)</text>
</svg>
